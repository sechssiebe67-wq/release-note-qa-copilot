apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "release-note-qa-copilot.serviceAccountName" . }}
  labels:
    {{- include "release-note-qa-copilot.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
